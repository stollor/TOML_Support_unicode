name: Build Extension

on:
  push:
    branches: [feature/chinese-key-support]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download pre-built dist from npm
        run: |
          cd editors/vscode
          npm pack @taplo/lsp@0.8.1
          tar -xzf taplo-lsp-0.8.1.tgz
          mkdir -p dist
          cp package/dist/* dist/ 2>/dev/null || true
          rm -rf package taplo-lsp-0.8.1.tgz

      - name: Build extension with esbuild
        run: |
          cd editors/vscode
          npm install esbuild --save-dev
          npx esbuild src/extension.ts --bundle --outfile=dist/extension.js --external:vscode --format=cjs --platform=node
          npx esbuild src/server.ts --bundle --outfile=dist/server.js --external:vscode --format=cjs --platform=node

      - name: Package VSIX
        run: |
          cd editors/vscode
          npx @vscode/vsce package --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: toml-support-unicode
          path: editors/vscode/*.vsix
