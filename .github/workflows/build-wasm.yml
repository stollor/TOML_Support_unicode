name: Build Extension

on:
  push:
    branches: [feature/chinese-key-support]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove packageManager and fix build script
        run: |
          cd editors/vscode
          sed -i '/"packageManager"/d' package.json
          sed -i 's/exec("yarn"/exec("npm", ["run"]/g' scripts/build.mjs
          sed -i 's/]);$/])/g' scripts/build.mjs

      - name: Install dependencies
        run: |
          cd editors/vscode
          npm install --legacy-peer-deps

      - name: Build extension
        run: |
          cd editors/vscode
          npm run build

      - name: Package VSIX
        run: |
          cd editors/vscode
          npx @vscode/vsce package --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: toml-support-unicode
          path: editors/vscode/*.vsix
